// 本地加速用：用 -I 引用本脚本，在原有仓库前面插入阿里云镜像（原仓库保留作为兜底）。
// 用法：cd android && ./gradlew -I ../gradle-mirror.gradle <task>
def PUBLIC = 'https://maven.aliyun.com/repository/public'
def GOOGLE = 'https://maven.aliyun.com/repository/google'
def PLUGIN = 'https://maven.aliyun.com/repository/gradle-plugin'

def addMirrors = { repos ->
  repos.maven { name = 'aliyunPublic'; url = PUBLIC }
  repos.maven { name = 'aliyunGoogle'; url = GOOGLE }
  repos.maven { name = 'aliyunPlugin'; url = PLUGIN }
}

beforeSettings { settings ->
  addMirrors(settings.pluginManagement.repositories)
  addMirrors(settings.dependencyResolutionManagement.repositories)
}

gradle.beforeProject { project ->
  addMirrors(project.buildscript.repositories)
  addMirrors(project.repositories)
}
