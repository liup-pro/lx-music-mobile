<!--
  件：parts/common-control/topbar —— U01 · .topbar 吸顶头部（头像 / 搜索条 / 波纹钮；U03 告警点静态实例在本件内）
  派生物 · 请勿手改：重跑 node scripts/gen-newui-parts.mjs 同步原型（Node v22）
  权威源（本件是它们的无损切片，元素/规则归属唯一；读件即读原型原文，禁止转述）：
    index.html L84-L98（本件持有 12 个元素）
    styles.css 中归本件的 8 条见同名 .css
    app.js：事件接线在 init() 尾部（#searchBtn / #castBtn / #avatarBtn）；头像首字由 renderProfile() 写入。
-->
<header class="topbar" id="topbar">
  <div class="topbar-row">
    <button class="avatar-btn" id="avatarBtn" aria-label="侧栏">
      <span class="avatar" id="topAvatar" style="--c1:#FF5C8A;--c2:#7A3BFF">野</span>
    </button>
    <button class="searchbar" id="searchBtn">
      <svg class="ic"><use href="#i-search"/></svg>
      <span class="ph">搜索歌曲 · 支持五平台</span>
    </button>
    <button class="icon-btn" id="castBtn" aria-label="音源设置">
      <span class="pulse-dot" id="castDot" hidden></span>
      <svg class="ic"><use href="#i-wave"/></svg>
    </button>
  </div>
</header>
