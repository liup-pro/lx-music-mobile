<div class="minibar" id="minibar">
  <div class="mini-progress"><i id="miniProgressFill"></i></div>
  <div class="mini-main">
    <div class="mini-art" id="miniArt"></div>
    <div class="mini-meta">
      <div class="mini-title" id="miniTitle"></div>
      <div class="mini-sub" id="miniSub"></div>
    </div>
    <button class="mini-act" id="miniHeart" aria-label="喜欢"><svg class="ic"><use href="#i-heart"/></svg></button>
    <button class="mini-act primary" id="miniPlay" aria-label="播放/暂停"><svg class="ic"><use href="#i-play"/></svg></button>
    <!-- 迷你条只给一枚「下一曲」：上一曲要回到开头得进播放页操作，这里放不下两个 -->
    <button class="mini-act" id="miniNext" aria-label="下一曲"><svg class="ic"><use href="#i-next"/></svg></button>
  </div>
</div>
