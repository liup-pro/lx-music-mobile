<div class="sheet" id="nameSheet">
  <div class="sheet-mask" data-close></div>
  <div class="sheet-body">
    <div class="sheet-handle"></div>
    <h3 class="sheet-title">修改昵称</h3>
    <div class="sheet-sub">头像用昵称的第一个字，顶左上角的那颗圆也一起换。</div>
    <div class="op-box">
      <input class="op-input" id="nameInput" placeholder="想叫什么" autocomplete="off" maxlength="12">
      <button class="op-go" id="nameGo">保存</button>
    </div>
    <div class="op-err" id="nameErr" hidden></div>
    <div class="group-label">换个快的</div>
    <div class="hot-words" id="namePicks"></div>
    <p class="sc-hint">昵称只保存在这台设备的存储里，不上传任何服务器 · 更换设备后回到「EchoIsle」。</p>
  </div>
</div>
