<div class="sheet" id="plIdSheet">
  <div class="sheet-mask" data-close></div>
  <div class="sheet-body">
    <div class="sheet-handle"></div>
    <h3 class="sheet-title">打开歌单</h3>
    <div class="sheet-sub">把平台上分享出来的歌单链接贴进来，或者只填那串歌单 ID。</div>
    <div class="op-box">
      <input class="op-input" id="plIdInput" placeholder="歌单链接 / ID" autocomplete="off" spellcheck="false">
      <button class="op-go" id="plIdGo">打开</button>
    </div>
    <div class="op-err" id="plIdErr" hidden></div>
    <!-- 裸 ID 形态必须有平台坐标：链接能按域名认出来，一串号认不出来，所以让用户点一下 -->
    <div class="group-label" id="plIdPlatLabel">只填 ID 的话，先点这份歌单来自哪个平台</div>
    <div class="hot-words" id="plIdPlats"></div>
    <div class="group-label">可以试试这几个</div>
    <div class="hot-words" id="plIdSamples"></div>
    <p class="sc-hint">歌单包含哪些平台的歌曲取决于歌单本身 · 能否播放在点播放时确认。</p>
  </div>
</div>
